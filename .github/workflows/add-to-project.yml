name: Add issues to project

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1
        with:
          project-url: https://github.com/orgs/govtech-bb/projects/12
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
