name: Release

on:
  push:
    branches: [main]
    paths:
      - packages/*/package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  queue: max

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.release.outputs.needed }}
      version: ${{ steps.release.outputs.version }}
      npm_tag: ${{ steps.release.outputs.npm_tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reconcile release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node ci/release.mjs check > "$RUNNER_TEMP/release.json"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/release.json" >> "$GITHUB_OUTPUT"

  checks:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [ci, storybook, react-18]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-checks
        with:
          suite: ${{ matrix.suite }}

  pack:
    needs: [check, checks]
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/*' build
      - name: Verify notes and pack both packages
        run: node ci/release.mjs pack "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: release-${{ needs.check.outputs.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [check, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/packages
      - name: Validate both packages before reserving the version
        run: node ci/release.mjs verify "$RUNNER_TEMP/packages"
      - name: Reserve the release source
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            test "$(git rev-parse "$tag^{commit}")" = "$RELEASE_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" -m "$tag" "$RELEASE_SHA"
            git push origin "$tag"
          fi
      - name: Publish or reconcile exact tarballs
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          RELEASE_SHA: ${{ needs.check.outputs.sha }}
        # npm reads this environment value for its source digest. A later manual
        # dispatch must attest the checked-out release, not the dispatch commit.
        run: GITHUB_SHA="$RELEASE_SHA" node ci/release.mjs publish "$RUNNER_TEMP/packages"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          NPM_TAG: ${{ needs.check.outputs.npm_tag }}
        run: |
          set -euo pipefail
          node ci/release.mjs check > "$RUNNER_TEMP/release.json"
          if [[ "$(jq -r .needed "$RUNNER_TEMP/release.json")" == false ]]; then exit 0; fi
          pnpm exec git-cliff --latest --strip header > "$RUNNER_TEMP/release-notes.md"
          args=(--verify-tag --title "v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$NPM_TAG" == alpha ]]; then args+=(--prerelease); fi
          gh release create "v$RELEASE_VERSION" "${args[@]}"
