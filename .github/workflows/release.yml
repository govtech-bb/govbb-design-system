name: Release

# Publishes the version on main once a release PR (`pnpm release:prepare`)
# merges: gate on the full CI suite, tag, publish @govtech-bb/frontend and
# @govtech-bb/react to npm with provenance, and cut a GitHub release whose
# notes are the changelog section. Every step skips work already done, so a
# failed run can be re-run from its own page (re-running keeps the release
# commit; a fresh run would not).

on:
  push:
    branches: [main]
    paths:
      - packages/*/package.json

permissions:
  contents: read

concurrency: release

jobs:
  # dependency bumps touch package.json too, so only release when this push
  # changed the version
  check:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.release.outputs.needed }}
      version: ${{ steps.release.outputs.version }}
      npm_tag: ${{ steps.release.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read release version
        id: release
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version=$(jq -r .version packages/frontend/package.json)
          react_version=$(jq -r .version packages/react/package.json)
          if [[ "$version" != "$react_version" ]]; then
            echo "frontend ($version) and react ($react_version) must share a version" >&2
            exit 1
          fi

          previous=$(git show "$BEFORE:packages/frontend/package.json" | jq -r .version)
          if [[ "$version" == "$previous" ]]; then
            echo "Version is still $version, nothing to release"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$version" =~ ^1\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Version must be a valid 1.x semver, got $version" >&2
            exit 1
          fi

          npm_tag=latest
          if [[ "${version%%+*}" == *-* ]]; then
            npm_tag=alpha
          fi

          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-cliff walks the full history
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # same gate as ci.yml — never release a red tree
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm storybook:typecheck
      - run: pnpm storybook:test
      - run: pnpm storybook:build

      - name: Tag
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            if [[ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "$tag already exists on another commit" >&2
              exit 1
            fi
            echo "$tag already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

      - name: Publish to npm (OIDC)
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          NPM_TAG: ${{ needs.check.outputs.npm_tag }}
        run: |
          set -euo pipefail
          npm install -g npm@latest
          mkdir -p /tmp/pkgs
          for pkg in frontend react; do
            name="@govtech-bb/$pkg"
            if npm view "$name@$RELEASE_VERSION" version > /dev/null 2>&1; then
              echo "$name@$RELEASE_VERSION already published — skipping"
              continue
            fi
            pnpm --filter "$name" pack --pack-destination /tmp/pkgs
            npm publish "/tmp/pkgs/govtech-bb-$pkg-$RELEASE_VERSION.tgz" --provenance --access public --tag "$NPM_TAG"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          NPM_TAG: ${{ needs.check.outputs.npm_tag }}
        run: |
          pnpm exec git-cliff --latest --strip header > release-notes.md
          args=(--verify-tag --title "v$RELEASE_VERSION" --notes-file release-notes.md)
          if [[ "$NPM_TAG" == alpha ]]; then args+=(--prerelease); fi
          gh release create "v$RELEASE_VERSION" "${args[@]}"
