name: Release

# One-button lockstep release of @govtech-bb/frontend and @govtech-bb/react:
# gate on the full CI suite, bump both versions, regenerate the changelog
# (git-cliff), commit + tag on main, publish to npm with provenance, and cut
# a GitHub release whose notes are the changelog section.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, no leading v (e.g. 0.1.0)'
        required: true

permissions:
  contents: write
  id-token: write # npm provenance

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # git-cliff walks the full history
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # same gate as ci.yml — never release a red tree
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm storybook:typecheck
      - run: pnpm storybook:test
      - run: pnpm storybook:build

      - name: Validate release version and npm tag
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^1\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Version must be a valid 1.x semver without a leading v" >&2
            exit 1
          fi

          npm_tag=latest
          version_without_build="${RELEASE_VERSION%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            npm_tag=alpha
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"

      - name: Bump package versions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: pnpm --filter "./packages/*" exec npm pkg set "version=$RELEASE_VERSION"

      - name: Regenerate changelog
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: pnpm exec git-cliff --tag "v$RELEASE_VERSION" --output CHANGELOG.md

      - name: Commit and tag
        env:
          LEFTHOOK: '0' # checks already ran above
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/frontend/package.json packages/react/package.json CHANGELOG.md
          git commit -m "chore: release v$RELEASE_VERSION"
          git tag -a "v$RELEASE_VERSION" -m "v$RELEASE_VERSION"
          git push origin main --follow-tags

      - name: Publish to npm (OIDC)
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: |
          set -euo pipefail
          npm install -g npm@latest
          mkdir -p /tmp/pkgs
          for pkg in frontend react; do
            name="@govtech-bb/$pkg"
            if npm view "$name@$RELEASE_VERSION" version > /dev/null 2>&1; then
              echo "$name@$RELEASE_VERSION already published — skipping"
              continue
            fi
            pnpm --filter "$name" pack --pack-destination /tmp/pkgs
            npm publish "/tmp/pkgs/govtech-bb-$pkg-$RELEASE_VERSION.tgz" --provenance --access public --tag "$NPM_TAG"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
        run: |
          pnpm exec git-cliff --latest --strip header > release-notes.md
          args=(--title "v$RELEASE_VERSION" --notes-file release-notes.md)
          if [[ "$NPM_TAG" == alpha ]]; then args+=(--prerelease); fi
          gh release create "v$RELEASE_VERSION" "${args[@]}"
