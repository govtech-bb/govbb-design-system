name: Update visual baselines

# Regenerates the -linux visual regression baselines on the CI image and
# commits them to the branch the workflow is dispatched on. Run this after an
# intentional visual change (or to seed the baselines the first time); the
# visual-regression CI job compares against what this commits.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:visual --update-snapshots
      - name: Commit baselines
        env:
          LEFTHOOK: '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci/visual-regression/screenshots
          git diff --cached --quiet && { echo "baselines unchanged"; exit 0; }
          git commit -m "test: update visual regression baselines"
          git push
