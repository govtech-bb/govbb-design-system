version: 1
applications:
  - appRoot: apps/site
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 24 || nvm install 24
            - corepack enable
            - pnpm config set store-dir .pnpm-store
            - pnpm install --frozen-lockfile
        build:
          commands:
            # -w = workspace root; recursive build runs @govtech-bb/frontend
            # (dist/govbb.css) before the site, in dependency order
            - pnpm -w build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .pnpm-store/**/*
      customHeaders:
        - pattern: '**/*'
          headers:
            - key: X-Content-Type-Options
              value: nosniff
            - key: X-Frame-Options
              value: SAMEORIGIN
            - key: Referrer-Policy
              value: strict-origin-when-cross-origin
            - key: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
