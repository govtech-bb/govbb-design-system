# git-cliff configuration — https://git-cliff.org/docs/configuration
# One changelog, grouped into sections by commit scope (= component).
# Unscoped commits fall under "General". e.g. feat(button): ... -> ### button

[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }}{% if timestamp %} ({{ timestamp | date(format="%Y-%m-%d") }}){% endif %}{% else %}## Unreleased{% endif %}
{% for scope, scoped in commits | group_by(attribute="scope") %}
### {{ scope }}
{% for commit in scoped %}- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }} by @{{ commit.author.name | replace(from=" ", to="") }}
{% endfor %}{% endfor %}{% set_global has_general = false %}{% for commit in commits %}{% if not commit.scope %}{% set_global has_general = true %}{% endif %}{% endfor %}{% if has_general %}
### General
{% for commit in commits %}{% if not commit.scope %}- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }} by @{{ commit.author.name | replace(from=" ", to="") }}
{% endif %}{% endfor %}{% endif %}
"""
footer = "<!-- generated by git-cliff -->\n"
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
  { pattern = '^chore\(deps.*\):', replace = 'chore(Dependencies):' },
]
commit_parsers = [
  { message = '^init$', skip = true },
  { message = '^chore\(release\):', skip = true },
  { message = '^Merge ', skip = true },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = 'v[0-9]+\.[0-9]+\.[0-9]+.*'
topo_order = false
sort_commits = "oldest"
