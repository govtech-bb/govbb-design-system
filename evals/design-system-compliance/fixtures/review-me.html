<!doctype html>
<!--
  Fixture for the "compliance review" eval. Every problem below is planted
  deliberately; the point is whether a reviewer finds them without inventing
  new ones. Do not "fix" this file — it is the input, not the output.

  This is a test input, not an example to copy. Nothing here is a model of how
  to write GovBB markup: the classes and tokens below include names the design
  system does not have, and copying any of it into a real service would be a
  compliance failure of exactly the kind the skill exists to prevent.

  Planted issues:
   1. .govbb-card        — invented class, no such component
   2. .govbb-alert       — invented class (real answer: status banner)
   3. .govbb-badge       — invented class, no such component
   4. --govbb-color-primary — invented token (real: --govbb-color-brand)
   5. .govbb-button override in service CSS — restyling component internals
   6. header uses .govbb-header but no data-govbb-module / initAll()
   7. file upload likewise missing its module wiring
   8. hardcoded #00267f, 16px, 1.25rem where tokens exist
   9. --govbb-blue-100 used directly where the semantic token is meant
  10. hint text present but not associated via aria-describedby
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply for a permit</title>
    <link
      rel="stylesheet"
      href="/node_modules/@govtech-bb/frontend/dist/govbb.css"
    />
    <style>
      .govbb-button {
        background: #00267f;
        border-radius: 12px;
      }
      .permit-intro {
        color: var(--govbb-blue-100);
        padding: 16px;
        font-size: 1.25rem;
      }
      .permit-total {
        color: var(--govbb-color-primary);
      }
    </style>
  </head>
  <body>
    <header class="govbb-header">
      <div class="govbb-header__inner">
        <a class="govbb-header__logo" href="/">Government of Barbados</a>
        <button class="govbb-header__toggle" type="button">Menu</button>
      </div>
    </header>

    <main class="govbb-width-container">
      <div class="govbb-alert govbb-alert--warning">
        Applications close on 30 September.
      </div>

      <h1>Apply for a permit</h1>
      <p class="permit-intro">
        Use this service to apply for a trading permit.
      </p>

      <div class="govbb-card">
        <span class="govbb-badge">New</span>
        <h2>Before you start</h2>
        <p>You will need your National ID and proof of address.</p>
      </div>

      <form method="post">
        <div class="govbb-form-group">
          <label class="govbb-label" for="nid">National ID number</label>
          <span class="govbb-hint">For example, 123456-7890</span>
          <input class="govbb-input" id="nid" name="nid" type="text" />
        </div>

        <div class="govbb-file-upload">
          <label class="govbb-label" for="proof">Proof of address</label>
          <input id="proof" name="proof" type="file" />
        </div>

        <p class="permit-total">Total fee: $150.00</p>

        <button class="govbb-button" type="submit">Submit application</button>
      </form>
    </main>
  </body>
</html>
