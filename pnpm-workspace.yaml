packages:
  - packages/*
  - apps/*

# pnpm 11.9 gates dependency build scripts behind an explicit allowlist.
# esbuild (Vite/Astro build), sharp (Astro image optimization) and lefthook
# (git hooks) all need theirs to run. NB: this pnpm version honours
# `allowBuilds`, not the older `onlyBuiltDependencies` list — see #15 to
# reconcile this repo-wide.
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
